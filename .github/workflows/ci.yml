# CI: a cada push na main e a cada pull request, o GitHub sobe uma máquina limpa
# e confere se o backend compila e se todos os testes passam.
# Passo a passo explicado em backend/GUIA-CI.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest

    # Todos os comandos "run" rodam dentro da pasta backend
    defaults:
      run:
        working-directory: backend

    # Um Postgres de verdade, só para os testes de integração.
    # Ele nasce vazio e some quando o CI termina.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # o nome precisa terminar em _test (trava do test-integration/database-guard.ts)
          POSTGRES_DB: salaoregina_test
        ports:
          - 5432:5432
        # só segue para os passos quando o banco já aceita conexões
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Baixa o código
        uses: actions/checkout@v5

      - name: Instala o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # guarda o cache do npm entre execuções (instala mais rápido)
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Compila o TypeScript
        run: npm run build

      - name: Testes unitários
        run: npm test

      # O .env.test não vai para o GitHub (está no .gitignore): o CI cria o dele,
      # apontando para o Postgres do "services" acima. A senha é só deste banco
      # descartável, não é segredo.
      - name: Cria o .env.test
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/salaoregina_test?schema=public" > .env.test

      - name: Testes de integração e de API
        run: npm run test:int
